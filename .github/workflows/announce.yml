name: Announce release

# Posts a Telegram rich message announcing a release. Reusable: call it from a
# release workflow once the artifact is actually installable, e.g.
#
#   announce:
#     needs: publish
#     uses: Pepebits/release-announce/.github/workflows/announce.yml@v1
#     with:
#       tag: ${{ github.ref_name }}
#     secrets: inherit
#
# See the README for every input. Callers decide when to run it (and on what
# trigger); this file only builds the message and sends it.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to announce, vX.Y.Z or X.Y.Z, after tag_prefix if one is set
        type: string
        required: true
      tag_prefix:
        description: 'What comes before the version in a monorepo tag, e.g. "my-lib-php-" for my-lib-php-v1.2.3. Empty for plain tags.'
        type: string
        default: ''
      project_name:
        description: Name shown in the title. Defaults to the repository name.
        type: string
        default: ''
      notes_source:
        description: "tag (the annotated tag's message) or changelog (its section of a Keep a Changelog file)"
        type: string
        default: tag
      changelog_path:
        description: Keep a Changelog file, read at the tag. Only for notes_source changelog.
        type: string
        default: CHANGELOG.md
      install_title:
        description: Heading above the install command, e.g. "🐳 Docker image"
        type: string
        default: 📦 Install
      install_command:
        description: Command people paste to get this version; {version} and {tag} are replaced. Empty omits the section.
        type: string
        default: ''
      install_language:
        description: Syntax highlighting of the install command
        type: string
        default: bash
      buttons:
        description: 'JSON array of {text, url} or {text, copy_text}, with an optional style (primary, success, danger); a nested array is a row of its own. {version}, {minor}, {tag} and {repo_url} are replaced. Default: one Notes button to the GitHub release.'
        type: string
        default: '[{"text":"📝 Notes","url":"{repo_url}/releases/tag/{tag}"}]'
      banner_path:
        description: Banner image in the repository, used only if it exists at the tag and banner_url is empty
        type: string
        default: docs/banner.png
      banner_url:
        description: 'Banner image at a fixed https URL, used instead of banner_path; {repo}, {owner}, {version}, {minor} and {tag} are replaced. Empty uses banner_path.'
        type: string
        default: ''
      fold:
        description: "always (every section folded), auto (a list of three items or fewer stays open) or never"
        type: string
        default: always
      message_thread_id:
        description: Topic of a forum supergroup to post in. Empty posts to the main chat.
        type: string
        default: ''
      disable_notification:
        description: Post silently, without a notification sound
        type: boolean
        default: false
      protect_content:
        description: Stop the message from being forwarded or saved
        type: boolean
        default: false
      footer:
        description: Closing line; {version}, {minor} and {tag} are replaced. Empty omits it.
        type: string
        default: ''
      chat:
        description: "announcements (the real channel) or test (TELEGRAM_TEST_CHAT_ID)"
        type: string
        default: announcements
      dry_run:
        description: Only print the message, send nothing
        type: boolean
        default: false
    # Optional: a fork without them skips the announcement instead of failing.
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      TELEGRAM_TEST_CHAT_ID:
        required: false

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Inputs reach the scripts through the environment, never through ${{ }}
      # inside `run:` — a crafted tag name would otherwise be shell code.
      TAG: ${{ inputs.tag }}
      TAG_PREFIX: ${{ inputs.tag_prefix }}
      PROJECT_NAME: ${{ inputs.project_name || github.event.repository.name }}
      NOTES_SOURCE: ${{ inputs.notes_source }}
      CHANGELOG_PATH: ${{ inputs.changelog_path }}
      INSTALL_TITLE: ${{ inputs.install_title }}
      INSTALL_COMMAND: ${{ inputs.install_command }}
      INSTALL_LANGUAGE: ${{ inputs.install_language }}
      BUTTONS: ${{ inputs.buttons }}
      BANNER_PATH: ${{ inputs.banner_path }}
      BANNER_URL: ${{ inputs.banner_url }}
      FOOTER: ${{ inputs.footer }}
      FOLD: ${{ inputs.fold }}
      MESSAGE_THREAD_ID: ${{ inputs.message_thread_id }}
      DISABLE_NOTIFICATION: ${{ inputs.disable_notification }}
      PROTECT_CONTENT: ${{ inputs.protect_content }}
      CHAT: ${{ inputs.chat }}
      DRY_RUN: ${{ inputs.dry_run }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}

    steps:
      - name: Check the inputs
        run: |
          # A monorepo tags each package with its own prefix; the version is
          # what follows it. The prefix is matched literally (quoted), and
          # limited to what a tag name can hold, so it cannot widen the check.
          if ! [[ "$TAG_PREFIX" =~ ^[A-Za-z0-9._/@-]*$ ]]; then
            echo "::error::tag_prefix may only hold letters, digits and . _ / @ -"
            exit 1
          fi
          if [[ "$TAG" != "$TAG_PREFIX"* ]] || ! [[ "${TAG#"$TAG_PREFIX"}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (${TAG_PREFIX}vX.Y.Z or ${TAG_PREFIX}X.Y.Z)"
            exit 1
          fi
          case "$NOTES_SOURCE" in tag | changelog) ;; *)
            echo "::error::notes_source must be 'tag' or 'changelog', not '$NOTES_SOURCE'"
            exit 1 ;;
          esac
          case "$CHAT" in announcements | test) ;; *)
            echo "::error::chat must be 'announcements' or 'test', not '$CHAT'"
            exit 1 ;;
          esac
          # A button is a link (http, https or tg) or a copy-to-clipboard button
          # of 1-256 characters, checked with its placeholders filled in as the
          # message will have them. Telegram takes 1-8 buttons in a row; a row
          # given as a nested array must fit. --argjson takes exactly one JSON
          # value, so anything else is refused too.
          version="${TAG#"$TAG_PREFIX"}"
          version="${version#v}"
          if ! jq -en --argjson buttons "$BUTTONS" \
              --arg version "$version" --arg minor "$(cut -d. -f1,2 <<< "$version")" \
              --arg tag "$TAG" --arg repo_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" '
              def subst:
                gsub("\\{version\\}"; $version) | gsub("\\{minor\\}"; $minor)
                | gsub("\\{tag\\}"; $tag) | gsub("\\{repo_url\\}"; $repo_url);
              def filled: type == "string" and (subst | length > 0);
              def ok_button:
                type == "object"
                and (keys - ["text", "url", "copy_text", "style"] | length == 0)
                and (.text | filled)
                and ([has("url"), has("copy_text")] | map(select(.)) | length == 1)
                and (if has("url") then (.url | filled) and (.url | subst | test("^(https?|tg)://\\S+$"))
                     else (.copy_text | filled) and (.copy_text | subst | length <= 256) end)
                and ((has("style") | not) or (.style | IN("primary", "success", "danger")));
              $buttons | type == "array"
              and all(.[]; ok_button or (type == "array" and length >= 1 and length <= 8 and all(.[]; ok_button)))' > /dev/null; then
            echo "::error::buttons must be a JSON array of {text, url} or {text, copy_text}, each with an optional style (primary, success or danger); a row is an array of 1-8 of them. Texts may not be empty, a url must start with http://, https:// or tg://, and copy_text holds at most 256 characters"
            exit 1
          fi
          case "$FOLD" in always | auto | never) ;; *)
            echo "::error::fold must be 'always', 'auto' or 'never', not '$FOLD'"
            exit 1 ;;
          esac
          if ! [[ "$MESSAGE_THREAD_ID" =~ ^([1-9][0-9]{0,14})?$ ]]; then
            echo "::error::message_thread_id must be a topic's number"
            exit 1
          fi
          # Telegram downloads the banner itself; anything but https is refused
          # here rather than turning into a send failure after the release.
          if [ -n "$BANNER_URL" ] && ! [[ "$BANNER_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::banner_url must be an https:// URL"
            exit 1
          fi

      # The caller's repository: the tag, the changelog and the banner live
      # there.
      - uses: actions/checkout@v7

      # The jq program that builds the payload is written out here instead of
      # being fetched from this repository. A reusable workflow runs in the
      # caller's workspace, so a plain checkout never sees a file that lives
      # next to it, and checking this repository out needs a ref that matches
      # the version being called: github.job_workflow_sha, which would give
      # it, is empty in practice, and a branch would make `@v1` and a pinned
      # sha run whatever main holds. Inlined, a pin covers the program too.
      # test/run.sh extracts these very lines, so the tests cover what runs.
      - name: Write the message template
        run: |
          cat > "$RUNNER_TEMP/announce.jq" <<'JQ'
          # Turns release notes into a Bot API sendRichMessage payload.
          #
          # Input (raw, -R -s): either an annotated tag's message, or a whole Keep a
          # Changelog file, depending on --arg mode.
          # Arguments: --arg mode (tag | changelog) --arg chat_id --arg tag
          #            --arg version --arg minor --arg subject --arg repo_url
          #            --arg project_name --arg install_title --arg install_command
          #            --arg install_language --argjson buttons (see the buttons input)
          #            --arg banner_url (empty: no banner) --arg footer (empty: none)
          #            --arg notes_url (where the full notes are, linked when they are cut)
          # Optional: --arg fold (always | auto | never), --arg message_thread_id,
          #           --arg disable_notification true, --arg protect_content true,
          #           --arg output plain (the plain-text fallback instead)
          #
          # Needs Bot API 10.3 or later: blocks came in 10.2, the buttons block in 10.3.
          # Folded sections are `details` blocks, which the 10.5 change to expandable
          # quotations (text replaced by blocks) does not touch.
          #
          # The notes travel as plain JSON strings inside explicit blocks, never as
          # Markdown or HTML, so nothing in them can be parsed as formatting or markup
          # and there is nothing to escape. The notes' own Markdown is read here, into
          # typed blocks and RichText pieces: still structured data, still no parse
          # mode.

          # {version}, {minor}, {tag} and {repo_url} in a caller-supplied string.
          def subst:
            gsub("\\{version\\}"; $version)
            | gsub("\\{minor\\}"; $minor)
            | gsub("\\{tag\\}"; $tag)
            | gsub("\\{repo_url\\}"; $repo_url);

          # Splits a line of notes into RichText, reading the inline Markdown that
          # changelogs use: `code`, [text](https://…), <https://…>, bare https:// URLs,
          # **bold** or __bold__, *italic* or _italic_, ~~strikethrough~~, and \-escaped
          # punctuation, which stays literal. The rest stays plain, and a line with none
          # of it stays a bare string. Italic and __bold__ follow CommonMark's rule: no
          # space just inside the marks and no word character just outside, so 2 * 3,
          # *.js and snake_case stay literal. Styles nest (bold may hold italic or a
          # link), but code cannot sit inside them in Telegram, so a code span within
          # the marks is left beside the styled pieces around it.
          def rich:
            def styled($style):
              rich
              | if type == "array" and any(.[]; type == "object" and .type == "code") then
                  .[] | if type == "object" and .type == "code" then .
                        else {type: $style, text: .} end
                else {type: $style, text: .} end;
            # Adjacent plain pieces (an escape and the text around it) become one.
            def merged:
              reduce .[] as $p ([];
                if ($p | type) == "string" and (.[-1] | type) == "string"
                then .[:-1] + [.[-1] + $p] else . + [$p] end)
              | if length == 1 and (.[0] | type) == "string" then .[0] else . end;
            . as $s
            | [match(
                "\\\\(?<esc>[!-/:-@\\[-`{-~])"
                + "|`(?<code>[^`]+)`"
                + "|\\[(?<link_text>[^\\]]+)\\]\\((?<link_url>https?://[^)\\s]+)\\)"
                + "|<(?<autolink>https?://[^>\\s]+)>"
                + "|\\*\\*(?<bold>(?=\\S).+?(?<=\\S))\\*\\*"
                + "|(?<![\\w_])__(?<bold_>(?=\\S).+?(?<=\\S))__(?![\\w_])"
                + "|~~(?<strike>(?=\\S).+?(?<=\\S))~~"
                + "|(?<![\\w*])\\*(?<italic>[^\\s*](?:[^*]*[^\\s*])?)\\*(?![\\w*])"
                + "|(?<![\\w_])_(?<italic_>[^\\s_](?:[^_]*[^\\s_])?)_(?![\\w_])"
                + "|(?<![\\w/])(?<bare>https?://[^\\s<>()\\[\\]]*[^\\s<>()\\[\\].,;:!?'\"])";
                "g")] as $m
            | if ($m | length) == 0 then $s
              else
                reduce $m[] as $x ({pos: 0, out: []};
                  (reduce $x.captures[] as $g ({};
                     if $g.name != null and $g.string != null then .[$g.name] = $g.string
                     else . end)) as $c
                  | .out += (if $x.offset > .pos then [$s[.pos:$x.offset]] else [] end)
                  | .out += (if $c.esc then [$c.esc]
                             elif $c.code then [{type: "code", text: $c.code}]
                             elif $c.link_url then [{type: "url", text: $c.link_text, url: $c.link_url}]
                             elif $c.autolink then [{type: "url", text: $c.autolink, url: $c.autolink}]
                             elif $c.bare then [{type: "url", text: $c.bare, url: $c.bare}]
                             elif $c.bold then [$c.bold | styled("bold")]
                             elif $c.bold_ then [$c.bold_ | styled("bold")]
                             elif $c.strike then [$c.strike | styled("strikethrough")]
                             elif $c.italic then [$c.italic | styled("italic")]
                             else [$c.italic_ | styled("italic")] end)
                  | .pos = $x.offset + $x.length)
                | .out + (if .pos < ($s | length) then [$s[.pos:]] else [] end)
                | merged
              end;

          # Joins wrapped lines back into one, as the tag message wraps at ~78 columns
          # and a changelog bullet continues on indented lines.
          def unwrap: map(sub("^\\s+"; "")) | join(" ");

          # A section title gets an emoji matching what it holds; anything unrecognised
          # still gets one, so every section reads the same. Covers the tag notes'
          # usual titles and every Keep a Changelog one.
          def section_emoji:
            ascii_downcase as $t
            | if ($t | test("fix|bug")) then "🐛"
              elif ($t | test("feat|new|add")) then "✨"
              elif ($t | test("secur|cve|advisor")) then "🔒"
              elif ($t | test("break|upgrade|migrat|deprecat")) then "⚠️"
              elif ($t | test("chang")) then "🔄"
              elif ($t | test("remov")) then "🗑️"
              elif ($t | test("depend")) then "📦"
              else "📝" end;

          def titled: "\(section_emoji) \(.)";

          # --- Reading the notes into blocks ------------------------------------------
          #
          # The notes are read line by line, the way Markdown is, so a section keeps its
          # structure: paragraphs, lists nested by indentation (an item may hold several
          # paragraphs, code and sub-lists), ``` fenced code, #### sub-headings, > quotes,
          # tables, --- rules and - [x] task checkboxes. Anything else is a paragraph.

          def nbsp: " ";
          def blank: test("^\\s*$");
          def indent: capture("^(?<i> *)").i | length;
          def is_rule: test("^ {0,3}(?:(?:- *){3,}|(?:\\* *){3,}|(?:_ *){3,})$");
          def item_re: "^(?<indent> *)(?<marker>(?:[-*+]|(?<number>\\d+)[.)]) +)(?<text>\\S.*)$";
          def is_item: test("^ *(?:[-*+]|\\d+[.)]) +\\S") and (is_rule | not);
          def table_rule: test("^ *\\|? *:?-+:? *(?:\\| *:?-+:? *)*\\|? *$") and test("-");
          # A line that starts a block of its own, and so cannot carry on a paragraph.
          def starts_block: test("^ *(?:#{1,6}(?: |$)|>|```|~~~)") or is_rule;

          # The cells of a table row, its outer pipes dropped; \| stays inside a cell.
          def table_cells:
            sub("^ *\\|"; "") | sub("\\| *$"; "")
            | [splits("(?<!\\\\)\\|")] | map(sub("^\\s+"; "") | sub("\\s+$"; ""));

          # Text set in bold, as a section title is. Code cannot sit inside bold in
          # Telegram, so a code span stays beside the bold pieces around it.
          def bolded:
            rich
            | if type == "array" then map(if type == "object" and .type == "code" then . else {type: "bold", text: .} end)
              else {type: "bold", text: .} end;

          # Lines to blocks. $top is the outermost level of the notes, where a lone short
          # line is a heading rather than a paragraph.
          def blocks($top):
            if length == 0 then []
            elif .[0] | blank then .[1:] | blocks($top)

            # ``` or ~~~ fenced code, kept exactly as written; an unclosed fence runs to
            # the end.
            elif .[0] | test("^ *(?:```|~~~)") then
              (.[0] | capture("^(?<indent> *)(?<fence>`{3,}|~{3,}) *(?<lang>[^\\s`]*)")) as $f
              | . as $a
              | ("^ *" + $f.fence[0:1] + "{\($f.fence | length),} *$") as $close
              | (first(range(1; length) | select($a[.] | test($close))) // length) as $end
              | ($a[1:$end] | map(sub("^ {0,\($f.indent | length)}"; "")) | join("\n")) as $code
              | (if ($code | test("\\S")) then
                   [{type: "pre", text: $code} + (if $f.lang == "" then {} else {language: $f.lang} end)]
                 else [] end)
                + ($a[$end + 1:] | blocks($top))

            elif .[0] | is_rule then [{type: "divider"}] + (.[1:] | blocks($top))

            # A heading; a closing run of #s goes, a # that ends a word (C#) stays.
            elif .[0] | test("^ *#{1,6}(?: |$)") then
              (.[0] | capture("^ *(?<h>#{1,6})(?<t>.*)$")) as $h
              | ($h.t | sub("^ +"; "") | sub("(?:^| +)#+ *$"; "") | sub(" +$"; "")) as $t
              | (if $t == "" then [] else [{type: "heading", size: ([$h.h | length, 3] | max), text: ($t | rich)}] end)
                + (.[1:] | blocks($top))

            elif .[0] | test("^ *>") then
              . as $a
              | (first(range(length) | select($a[.] | test("^ *>") | not)) // length) as $end
              | ($a[:$end] | map(sub("^ *> ?"; "")) | blocks(false)) as $inner
              | (if ($inner | length) == 0 then [] else [{type: "blockquote", blocks: $inner}] end)
                + ($a[$end:] | blocks($top))

            # A table: a row of pipes, then a |---|:---:| rule. Short rows are filled out
            # to the widest one. Telegram takes up to 20 columns; a wider table stays as
            # it was written, in a code block.
            elif (.[0] | test("^ *\\|")) and length > 1 and (.[1] | table_rule) then
              . as $a
              | (first(range(2; length) | select($a[.] | test("^ *\\|") | not)) // length) as $end
              | ($a[1] | table_cells | map(if test("^:-+:$") then "center" elif test("-:$") then "right"
                                            elif test("^:") then "left" else null end)) as $align
              | ([$a[0]] + $a[2:$end] | map(table_cells)) as $rows
              | ($rows | map(length) | max) as $width
              | (if $width > 20 then
                   [{type: "pre", text: ($a[:$end] | map(sub("^ +"; "")) | join("\n"))}]
                 else
                   [{type: "table", is_bordered: true,
                     cells: [$rows | to_entries[] | .key as $r
                             | [.value + [range($width - (.value | length)) | ""] | to_entries[]
                                | {text: (if .value == "" then nbsp else .value | rich end)}
                                  + (if $r == 0 then {is_header: true} else {} end)
                                  + (if $align[.key] then {align: $align[.key]} else {} end)]]}]
                 end)
                + ($a[$end:] | blocks($top))

            # A list: items at one indentation, each owning what is indented under it
            # (wrapped lines, more paragraphs, code, sub-lists) and the lines that carry
            # straight on from it. A line back at the list's own indentation after a
            # blank line ends it.
            elif .[0] | is_item then
              (.[0] | indent) as $b
              | . as $a
              | (first(range(1; length) | . as $j | select(
                   ($a[$j] | blank | not)
                   and ((($a[$j] | (is_item and indent <= $b + 1) or indent > $b)
                         or (($a[$j - 1] | blank | not) and ($a[$j] | starts_block | not)))
                        | not))) // length) as $end
              | $a[:$end] as $l
              | [range($l | length) | select($l[.] | is_item and indent <= $b + 1)] as $starts
              | [range($starts | length) as $k
                 | $l[$starts[$k]:($starts[$k + 1] // ($l | length))] as $it
                 | ($it[0] | capture(item_re)) as $m
                 | (($m.indent | length) + ($m.marker | length)) as $w
                 | ([$m.text | capture("^\\[(?<c>[ xX])\\] +(?<t>.*)$")] | first) as $box
                 | ([$box.t // $m.text] + ($it[1:] | map(sub("^ {0,\($w)}"; ""))) | blocks(false)) as $inner
                 | {blocks: (if ($inner | length) == 0 then [{type: "paragraph", text: nbsp}] else $inner end)}
                   + (if $box == null then {} else {has_checkbox: true} end)
                   + (if $box != null and $box.c != " " then {is_checked: true} else {} end)
                   + (if $m.number == null then {} else {value: ($m.number | tonumber), type: "1"} end)]
              | [{type: "list", items: .}] + ($a[$end:] | blocks($top))

            # A paragraph runs to a blank line or the start of another block; wrapped lines
            # are joined back into one.
            else
              . as $a
              | (first(range(1; length) | select($a[.] | blank or starts_block or is_item)) // length) as $end
              | ($a[:$end] | map(sub("^\\s+"; ""))) as $p
              | (if $top and ($p | length) == 1 and ($p[0] | length) <= 40 and ($p[0] | test("[.:]$") | not)
                 then {type: "heading", size: 3, text: ($p[0] | titled | rich)}
                 else {type: "paragraph", text: ($p | unwrap | rich)} end)
                as $block
              | [$block] + ($a[$end:] | blocks($top))
            end;

          # Telegram allows 16 levels of nested blocks and formatting. Each list level
          # takes two (the list and its item) and a quote one, so from the fifth level
          # down nothing nests any more: deeper items sit beside the fifth level's, and
          # deeper quotes keep their text without the quote.
          def flat_items:
            . as $item
            | [$item | .blocks |= (map(select(.type != "list"))
                                   | if length == 0 then [{type: "paragraph", text: nbsp}] else . end)]
              + [$item.blocks[] | select(.type == "list") | .items[] | flat_items[]];
          def cap($level):
            map(if .type == "list" then
                  if $level >= 5 then .items |= [.[] | (.blocks |= cap($level)) | flat_items[]]
                  else .items |= map(.blocks |= cap($level + 1)) end
                elif .type == "blockquote" then
                  if $level >= 5 then .blocks | cap($level) | .[]
                  else .blocks |= cap($level + 1) end
                elif .type == "details" then .blocks |= cap($level)
                else . end);

          # A rule at the end of a section (the --- a changelog puts between versions,
          # say) separates nothing.
          def trim_rules: until(length == 0 or .[-1].type != "divider"; .[:-1]);

          # For each line, whether it opens a fenced code block ("open"), sits in one or
          # closes it ("in"), or neither (false).
          def fenced:
            reduce .[] as $l ({open: null, out: []};
              if .open == null then
                ([$l | capture("^ *(?<f>`{3,}|~{3,})")] | first) as $m
                | if $m then .open = $m.f | .out += ["open"] else .out += [false] end
              else
                .open as $o
                | .out += ["in"]
                | if ($l | test("^ *" + $o[0:1] + "{\($o | length),} *$")) then .open = null else . end
              end)
            | .out;

          # Link reference definitions ("[1.0.0]: https://…", at the foot of a changelog)
          # and one-line <!-- comments --> are invisible in Markdown, so they are dropped.
          # "[core]: fixes" is not a link definition and stays.
          def is_link_def:
            test("^ {0,3}\\[[^\\]]+\\]: *<?(?:[a-z][a-z0-9+.-]*:|/|#|\\.)\\S*>?(?: +(?:\"[^\"]*\"|'[^']*'|\\([^)]*\\)))? *$"; "i");
          def is_comment: test("^ *<!--.*--> *$");

          # The notes as segments: what sits at the top, sections and upgrade notes.
          #
          # In a changelog a section is a "### Fixed" heading and everything up to the next
          # one. In a tag message it is a short title line (no full stop or colon) after a
          # blank line whose next line, blank lines aside, is a list item; it runs to the
          # next title, or to a line back at the margin after a blank line that is not an
          # item, which is top-level text again. An "Upgrade note:" (or Breaking, or
          # Migration) paragraph is a note of its own, folded like a section. Nothing in a
          # fenced code block opens or closes any of them.
          def is_title_line:
            test("^\\S") and length <= 40 and (test("[.:]$") | not) and (is_item | not)
            and (test("^(?:#|>|```|~~~|\\|)") | not) and (is_rule | not);
          def segments:
            fenced as $in
            | [to_entries[]
               | if $in[.key] == "in" then {l: .value, code: true}
                 elif .value | is_link_def or is_comment then empty
                 else {l: (.value | gsub("\t"; "    ") | sub("\\s+$"; "")), code: false} end] as $a
            | reduce range($a | length) as $i ({segs: [{kind: "top", lines: []}]};
                $a[$i].l as $l
                | ($i == 0 or ($a[$i - 1].l | blank)) as $after_blank
                | .segs[-1].kind as $kind
                | if $a[$i].code then .segs |= (.[:-1] + [.[-1] | .lines += [$l]])
                  elif $mode == "changelog" and ($l | test("^###\\s")) then
                    .segs += [{kind: "section", title: ($l | sub("^###\\s+"; "")), lines: []}]
                  elif $mode == "tag" and $after_blank and ($l | is_title_line)
                       and ((first($a[$i + 1:][] | select(.l | blank | not)) // {l: ""}).l | is_item and indent <= 3) then
                    .segs += [{kind: "section", title: $l, lines: []}]
                  elif $after_blank and ($mode == "tag" or $kind != "section")
                       and ($l | test("^(?:upgrade|breaking|migration) note:\\s*\\S"; "i")) then
                    ($l | capture("^(?<title>[^:]+):\\s*(?<rest>.*)$")) as $m
                    | .segs += [{kind: "note", title: $m.title,
                                 lines: [($m.rest[0:1] | ascii_upcase) + $m.rest[1:]]}]
                  elif $after_blank and ($l | blank | not)
                       and ($kind == "note"
                            or ($mode == "tag" and $kind == "section" and ($l | test("^\\S")) and ($l | is_item | not))) then
                    .segs += [{kind: "top", lines: [$l]}]
                  else .segs |= (.[:-1] + [.[-1] | .lines += [$l]]) end)
            | .segs;

          def fold_mode: $ARGS.named.fold // "always";

          # Sections fold under a bold title with an emoji. fold=never leaves them all
          # open, fold=auto opens the ones that are only a short list (three items or
          # fewer), and fold=always, the default, folds every one.
          def opened($inner):
            if fold_mode == "never"
               or (fold_mode == "auto" and ($inner | length) == 1 and $inner[0].type == "list"
                   and ([$inner[0] | .. | objects | .items? | arrays | .[]] | length) <= 3)
            then {is_open: true} else {} end;
          def segment_blocks:
            if .kind == "top" then .lines | blocks(true) | trim_rules
            else
              (.lines | blocks(false) | trim_rules) as $inner
              | (if .kind == "note" then "⚠️ \(.title)" else (.title | titled) end) as $title
              | if ($inner | length) == 0 then [{type: "heading", size: 3, text: ($title | rich)}]
                else [{type: "details", summary: ($title | bolded), blocks: $inner} + opened($inner)] end
            end;

          def notes_blocks: split("\n") | segments | map(segment_blocks) | add // [] | cap(1) | trim_rules;

          # The section of a Keep a Changelog file for this version: the lines after its
          # "## [X.Y.Z] — date" heading up to the next "## " outside a code block. Returns
          # {date, body}, or null when the version has no section.
          def changelog_section:
            split("\n") as $lines
            | ($lines | fenced) as $in
            | ("^##\\s+\\[?v?" + ($version | gsub("\\."; "\\.")) + "\\]?(\\s|$)") as $heading
            | (first(range($lines | length) | select(($in[.] | not) and ($lines[.] | test($heading)))) // null) as $at
            | if $at == null then null
              else
                ((first(range($at + 1; $lines | length) | select(($in[.] | not) and ($lines[.] | test("^## "))))
                  // ($lines | length)) as $end
                 | $lines[$at + 1:$end]) as $section
                | {date: (($lines[$at] | capture("(?<d>\\d{4}-\\d{2}-\\d{2})").d) // ""),
                   body: ($section | join("\n"))}
              end;

          # The notes cut to at most $cap characters: at the start of a list item, a
          # heading or a blank line when one is close to the cap, so no item is left half
          # written; otherwise at the end of a line, or failing that of a word.
          def cut($cap):
            if length <= $cap then .
            else
              .[0:$cap] as $s
              | ([$s | match("\n(?=\\s*(?:[-*+]|\\d+[.)])\\s|#|\\s*\n)"; "g").offset] | last // 0) as $item
              | ($s | rindex("\n") // 0) as $line
              | ($s | sub("\\S*$"; "") | length) as $word
              | $s[0:(if $item >= $cap * 0.8 then $item
                      elif $line >= $cap * 0.8 then $line
                      elif $word > 0 then $word
                      else $cap end)]
            end;

          # Every block Telegram counts towards its limit of 500: blocks at any depth,
          # list items and table rows.
          def block_count:
            [.. | objects | (.blocks?, .items?, .cells?) | arrays | .[]] | length;

          # What goes around the message itself: the chat, and the optional topic,
          # silent delivery and forwarding protection.
          def envelope:
            {chat_id: $chat_id}
            + (if ($ARGS.named.message_thread_id // "") == "" then {}
               else {message_thread_id: ($ARGS.named.message_thread_id | tonumber)} end)
            + (if $ARGS.named.disable_notification == "true" then {disable_notification: true} else {} end)
            + (if $ARGS.named.protect_content == "true" then {protect_content: true} else {} end);

          # Buttons in rows: a nested array is a row of its own, and the buttons
          # around them fill rows of up to 8, Telegram's limit for one row.
          def button_rows:
            reduce .[] as $b ({rows: [], open: false};
              if ($b | type) == "array" then .rows += [$b] | .open = false
              elif .open and (.rows[-1] | length) < 8 then .rows |= (.[:-1] + [.[-1] + [$b]])
              else .rows += [[$b]] | .open = true end)
            | .rows;
          def button:
            {text: (.text | subst)}
            + (if .url then {url: (.url | subst)} else {copy_text: {text: (.copy_text | subst)}} end)
            + (if .style then {style: .style} else {} end);

          # The whole message, with the notes cut at $cap characters.
          def message($cap):
            (if $mode == "changelog" then
               (changelog_section // {date: "", body: ""})
             else
               {date: "", body: .}
             end) as $notes
            | ($notes.body | cut($cap) | sub("\\s+$"; "")) as $body
            | (($notes.body | length) > $cap) as $was_cut
            | (if $mode == "changelog" then
                 (if $notes.date == "" then null else "📅 " end)
               else "✨ " end) as $sub_icon
            | (if $mode == "changelog" then $notes.date else $subject end) as $sub_text
            | envelope + {
                rich_message: {
                  skip_entity_detection: true,
                  blocks: (
                    (if $banner_url == "" then []
                     else [{type: "photo", photo: {type: "photo", media: $banner_url}}] end)
                    + [{type: "heading", size: 1,
                        text: ["🚀 \($project_name) ", {type: "bold", text: $version}]}]
                    + (if $sub_text == "" then []
                       else [
                         # Blocks carry no spacing of their own; a line holding only a
                         # non-breaking space sets the version apart from its subtitle.
                         {type: "paragraph", text: " "},
                         {type: "paragraph", text: [$sub_icon, {type: "italic", text: $sub_text}]}
                       ] end)
                    + ($body | notes_blocks)
                    + (if $was_cut then [
                         {type: "paragraph",
                          text: {type: "italic",
                                 text: ["… ", {type: "url", text: "the full notes", url: $notes_url}]}}]
                       else [] end)
                    + [{type: "divider"}]
                    + (if $install_command == "" then []
                       else [
                         # A code block rather than inline code: Telegram gives it a copy
                         # button, and the whole command is what people paste.
                         {type: "paragraph", text: {type: "bold", text: $install_title}},
                         {type: "pre", language: $install_language, text: ($install_command | subst)}
                       ] end)
                    + ($buttons | button_rows | map({type: "buttons", align: "center", buttons: map(button)}))
                    + (if $footer == "" then []
                       else [{type: "footer", text: ($footer | subst)}] end)
                  )
                }
              };

          # Rich messages take up to 32768 characters of text and 500 blocks. Counting
          # the whole JSON keeps well inside the first, and a long list of short items
          # reaches the second first, so a runaway changelog is cut (by a quarter at a
          # time) until both fit: the announcement is never lost, and it ends with a
          # link to the full notes.
          def fit($cap):
            message($cap) as $m
            | if (($m | tostring | length) <= 32000 and ($m.rich_message | block_count) <= 500)
                 or $cap < 500 then $m
              else fit($cap * 3 / 4 | floor) end;

          # The fallback when Telegram refuses the rich message: a plain sendMessage,
          # no parse mode, with the title, the install command and a link to the notes,
          # and the buttons as an inline keyboard.
          def plain_message:
            (if $mode == "changelog" then ((changelog_section // {}).date // "") else "" end) as $date
            | ((["🚀 \($project_name) \($version)"]
                + (if $mode == "changelog" then (if $date == "" then [] else ["📅 \($date)"] end)
                   else ["✨ \($subject)"] end)
                + (if $install_command == "" then []
                   else ["", $install_title, ($install_command | subst)] end)
                + ["", "📝 \($notes_url)"]
                + (if $footer == "" then [] else ["", ($footer | subst)] end))
               | join("\n") | .[0:4096]) as $text
            | envelope
              + {text: $text, link_preview_options: {is_disabled: true}}
              + (if ($buttons | length) == 0 then {}
                 else {reply_markup: {inline_keyboard: ($buttons | button_rows | map(map(button)))}} end);

          if ($ARGS.named.output // "rich") == "plain" then plain_message else fit(30000) end
          JQ

      # actions/checkout replaces an annotated tag with a lightweight one
      # pointing at the commit (actions/checkout#290), and a manual run does
      # not fetch it at all — either way the release notes would be lost.
      # Fetching the tag object itself keeps its message.
      - name: Fetch the annotated tag
        run: git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"

      - name: Build the message
        id: build
        run: |
          # Chosen here rather than with `cond && a || b` in the env block:
          # that idiom falls through to the real channel whenever the test
          # chat secret is empty.
          if [ "$CHAT" = test ]; then chat_id="$TELEGRAM_TEST_CHAT_ID"; else chat_id="$TELEGRAM_CHAT_ID"; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$chat_id" ]; then
            echo "::notice::No bot token or chat id secret for this target; the message is built but not sent"
          elif [ "$DRY_RUN" != true ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

          version="${TAG#"$TAG_PREFIX"}"
          version="${version#v}"
          subject=""
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [ "$NOTES_SOURCE" = changelog ]; then
            notes_url="$repo_url/blob/$TAG/$CHANGELOG_PATH"
          else
            notes_url="$repo_url/releases/tag/$TAG"
          fi
          if [ "$NOTES_SOURCE" = changelog ]; then
            # Read at the tag, not from the checked-out branch: a manual run
            # may be on a later commit whose changelog has moved on.
            git show "$TAG:$CHANGELOG_PATH" > "$RUNNER_TEMP/notes.txt" \
              || { echo "::error::$CHANGELOG_PATH does not exist at $TAG"; exit 1; }
            if ! grep -Eq "^##[[:space:]]+\[?v?${version//./\\.}\]?([[:space:]]|$)" "$RUNNER_TEMP/notes.txt"; then
              echo "::warning::$CHANGELOG_PATH has no section for $version; announcing it without notes"
            fi
          else
            # A lightweight tag has no message of its own: for-each-ref would
            # give the commit's, which are not release notes.
            if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
              echo "::warning::$TAG is a lightweight tag; announcing it without notes"
              : > "$RUNNER_TEMP/notes.txt"
            else
              subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
              git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" > "$RUNNER_TEMP/notes.txt"
            fi
          fi

          # An external banner (a generated social card, say) wins over the
          # repository's. Its placeholders are filled here, in bash, so the
          # same value works as one organization variable for every repository.
          # Otherwise Telegram fetches the repository's banner, linked at the
          # tag rather than at main: a later redesign must not change an old
          # post. Telegram keeps its own copy once sent, so an external image
          # changing later does not touch old posts either.
          banner_url=""
          if [ -n "$BANNER_URL" ]; then
            banner_url="$BANNER_URL"
            banner_url="${banner_url//\{repo\}/${GITHUB_REPOSITORY#*/}}"
            banner_url="${banner_url//\{owner\}/${GITHUB_REPOSITORY%%/*}}"
            banner_url="${banner_url//\{version\}/$version}"
            banner_url="${banner_url//\{minor\}/$(cut -d. -f1,2 <<< "$version")}"
            banner_url="${banner_url//\{tag\}/$TAG}"
          elif git cat-file -e "refs/tags/$TAG:$BANNER_PATH" 2>/dev/null; then
            banner_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/$BANNER_PATH"
          fi

          # Rich messages take up to 32768 characters and 500 blocks; the jq
          # program cuts the notes until both fit, so a runaway changelog cannot
          # lose the announcement, and links the full notes. The head only stops jq
          # from slurping something absurd.
          head -c 2000000 "$RUNNER_TEMP/notes.txt" \
            | jq -R -s -f "$RUNNER_TEMP/announce.jq" \
                --arg mode "$NOTES_SOURCE" \
                --arg chat_id "$chat_id" \
                --arg tag "$TAG" \
                --arg version "$version" \
                --arg minor "$(cut -d. -f1,2 <<< "$version")" \
                --arg subject "${subject:-$TAG}" \
                --arg repo_url "$repo_url" \
                --arg notes_url "$notes_url" \
                --arg project_name "$PROJECT_NAME" \
                --arg install_title "$INSTALL_TITLE" \
                --arg install_command "$INSTALL_COMMAND" \
                --arg install_language "$INSTALL_LANGUAGE" \
                --argjson buttons "$BUTTONS" \
                --arg banner_url "$banner_url" \
                --arg footer "$FOOTER" \
                --arg fold "$FOLD" \
                --arg message_thread_id "$MESSAGE_THREAD_ID" \
                --arg disable_notification "$DISABLE_NOTIFICATION" \
                --arg protect_content "$PROTECT_CONTENT" \
            > "$RUNNER_TEMP/message.json"
          # The same arguments again for the plain-text fallback, and the rich
          # message without its banner: what Telegram is sent if it refuses
          # the message as built.
          head -c 2000000 "$RUNNER_TEMP/notes.txt" \
            | jq -R -s -f "$RUNNER_TEMP/announce.jq" --arg output plain \
                --arg mode "$NOTES_SOURCE" \
                --arg chat_id "$chat_id" \
                --arg tag "$TAG" \
                --arg version "$version" \
                --arg minor "$(cut -d. -f1,2 <<< "$version")" \
                --arg subject "${subject:-$TAG}" \
                --arg repo_url "$repo_url" \
                --arg project_name "$PROJECT_NAME" \
                --arg install_title "$INSTALL_TITLE" \
                --arg install_command "$INSTALL_COMMAND" \
                --arg install_language "$INSTALL_LANGUAGE" \
                --argjson buttons "$BUTTONS" \
                --arg banner_url "$banner_url" \
                --arg footer "$FOOTER" \
                --arg notes_url "$notes_url" \
                --arg message_thread_id "$MESSAGE_THREAD_ID" \
                --arg disable_notification "$DISABLE_NOTIFICATION" \
                --arg protect_content "$PROTECT_CONTENT" \
            > "$RUNNER_TEMP/fallback.json"
          jq '.rich_message.blocks |= map(select(.type != "photo"))' "$RUNNER_TEMP/message.json" > "$RUNNER_TEMP/no-banner.json"
          # chat_id is a secret, so it shows as *** here.
          jq . "$RUNNER_TEMP/message.json"

      # The release is already public by the time this runs, so a Telegram
      # outage or a revoked bot must not turn a good release red. A failure
      # still shows as a warning on the run.
      - name: Send to Telegram
        if: steps.build.outputs.send == 'true'
        continue-on-error: true
        run: |
          # send <method> <payload file>: true when Telegram accepted it.
          # The token lives in the URL, so the URL goes to curl on stdin rather
          # than on its command line: it never appears in `ps`, in a `set -x`
          # trace or in a curl error message. Secrets are masked in the log
          # anyway; this keeps it out of everything else.
          send() {
            rm -f "$RUNNER_TEMP/response.json"
            printf 'url = "https://api.telegram.org/bot%s/%s"\n' "$TELEGRAM_BOT_TOKEN" "$1" \
              | curl --config - --silent --show-error \
                  --max-time 30 --retry 3 --retry-delay 5 \
                  --header 'Content-Type: application/json' \
                  --data-binary "@$2" \
                  --output "$RUNNER_TEMP/response.json" \
              || true
            [ "$(jq -r '.ok' "$RUNNER_TEMP/response.json" 2>/dev/null)" = true ]
          }
          # An empty body, an HTML error page or no file at all is "no response".
          reason() {
            local r
            r="$(jq -r 'select(type == "object") | "\(.error_code) \(.description)"' "$RUNNER_TEMP/response.json" 2>/dev/null)" || r=""
            echo "${r:-no response}"
          }
          sent() { echo "Sent as message $(jq -r '.result.message_id' "$RUNNER_TEMP/response.json")"; }

          refused() { [ "$(jq -r '.error_code' "$RUNNER_TEMP/response.json" 2>/dev/null)" = 400 ]; }

          if send sendRichMessage "$RUNNER_TEMP/message.json"; then sent; exit 0; fi
          first="$(reason)"
          # Only a 400 is Telegram refusing this message. Anything else (an
          # outage, a revoked token, a bot removed from the chat) would fail the
          # same way again, and with no answer at all the message may even have
          # arrived.
          if ! refused; then
            echo "::warning::Telegram announcement not sent: $first"
            exit 1
          fi
          # attempt <method> <payload file> <what it is>: the next, plainer
          # message. Each one only follows a refusal, so a message that may have
          # arrived is never followed by another.
          attempt() {
            if send "$1" "$2"; then
              echo "::warning::Telegram refused the announcement ($first); sent $3 instead"
              sent; exit 0
            fi
            if ! refused; then
              echo "::warning::Telegram announcement not sent: $first; then $(reason)"
              exit 1
            fi
          }
          # First without the banner, the one part fetched from elsewhere; then,
          # whatever else Telegram disliked, as plain text, and last without the
          # buttons, which the plain text shares with the rich message.
          if jq -e 'any(.rich_message.blocks[]; .type == "photo")' "$RUNNER_TEMP/message.json" > /dev/null; then
            attempt sendRichMessage "$RUNNER_TEMP/no-banner.json" "it without the banner"
          fi
          attempt sendMessage "$RUNNER_TEMP/fallback.json" "a plain-text one"
          if jq -e 'has("reply_markup")' "$RUNNER_TEMP/fallback.json" > /dev/null; then
            jq 'del(.reply_markup)' "$RUNNER_TEMP/fallback.json" > "$RUNNER_TEMP/fallback-bare.json"
            attempt sendMessage "$RUNNER_TEMP/fallback-bare.json" "a plain-text one without buttons"
          fi
          echo "::warning::Telegram announcement not sent: $first; every fallback was refused too: $(reason)"
          exit 1
