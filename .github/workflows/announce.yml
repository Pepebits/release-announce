name: Announce release

# Posts a Telegram rich message announcing a release. Reusable: call it from a
# release workflow once the artifact is actually installable, e.g.
#
#   announce:
#     needs: publish
#     uses: Pepebits/release-announce/.github/workflows/announce.yml@v1
#     with:
#       tag: ${{ github.ref_name }}
#     secrets: inherit
#
# See the README for every input. Callers decide when to run it (and on what
# trigger); this file only builds the message and sends it.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to announce, vX.Y.Z
        type: string
        required: true
      project_name:
        description: Name shown in the title. Defaults to the repository name.
        type: string
        default: ''
      notes_source:
        description: "tag (the annotated tag's message) or changelog (its section of a Keep a Changelog file)"
        type: string
        default: tag
      changelog_path:
        description: Keep a Changelog file, read at the tag. Only for notes_source changelog.
        type: string
        default: CHANGELOG.md
      install_title:
        description: Heading above the install command, e.g. "🐳 Docker image"
        type: string
        default: 📦 Install
      install_command:
        description: Command people paste to get this version; {version} and {tag} are replaced. Empty omits the section.
        type: string
        default: ''
      install_language:
        description: Syntax highlighting of the install command
        type: string
        default: bash
      buttons:
        description: 'JSON array of {text, url}; {version}, {minor}, {tag} and {repo_url} are replaced in the url. Default: one Notes button to the GitHub release.'
        type: string
        default: '[{"text":"📝 Notes","url":"{repo_url}/releases/tag/{tag}"}]'
      banner_path:
        description: Banner image in the repository, used only if it exists at the tag and banner_url is empty
        type: string
        default: docs/banner.png
      banner_url:
        description: 'Banner image at a fixed https URL, used instead of banner_path; {repo}, {owner}, {version}, {minor} and {tag} are replaced. Empty uses banner_path.'
        type: string
        default: ''
      footer:
        description: Closing line; {version}, {minor} and {tag} are replaced. Empty omits it.
        type: string
        default: ''
      chat:
        description: "announcements (the real channel) or test (TELEGRAM_TEST_CHAT_ID)"
        type: string
        default: announcements
      dry_run:
        description: Only print the message, send nothing
        type: boolean
        default: false
    # Optional: a fork without them skips the announcement instead of failing.
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      TELEGRAM_TEST_CHAT_ID:
        required: false

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Inputs reach the scripts through the environment, never through ${{ }}
      # inside `run:` — a crafted tag name would otherwise be shell code.
      TAG: ${{ inputs.tag }}
      PROJECT_NAME: ${{ inputs.project_name || github.event.repository.name }}
      NOTES_SOURCE: ${{ inputs.notes_source }}
      CHANGELOG_PATH: ${{ inputs.changelog_path }}
      INSTALL_TITLE: ${{ inputs.install_title }}
      INSTALL_COMMAND: ${{ inputs.install_command }}
      INSTALL_LANGUAGE: ${{ inputs.install_language }}
      BUTTONS: ${{ inputs.buttons }}
      BANNER_PATH: ${{ inputs.banner_path }}
      BANNER_URL: ${{ inputs.banner_url }}
      FOOTER: ${{ inputs.footer }}
      CHAT: ${{ inputs.chat }}
      DRY_RUN: ${{ inputs.dry_run }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}

    steps:
      - name: Check the inputs
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi
          case "$NOTES_SOURCE" in tag | changelog) ;; *)
            echo "::error::notes_source must be 'tag' or 'changelog', not '$NOTES_SOURCE'"
            exit 1 ;;
          esac
          case "$CHAT" in announcements | test) ;; *)
            echo "::error::chat must be 'announcements' or 'test', not '$CHAT'"
            exit 1 ;;
          esac
          if ! jq -e 'type == "array" and all(.[]; (.text | type == "string") and (.url | type == "string"))' <<< "$BUTTONS" > /dev/null; then
            echo "::error::buttons must be a JSON array of {text, url}"
            exit 1
          fi
          # Telegram downloads the banner itself; anything but https is refused
          # here rather than turning into a send failure after the release.
          if [ -n "$BANNER_URL" ] && ! [[ "$BANNER_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::banner_url must be an https:// URL"
            exit 1
          fi

      # The caller's repository: the tag, the changelog and the banner live
      # there.
      - uses: actions/checkout@v7

      # The jq program that builds the payload is written out here instead of
      # being fetched from this repository. A reusable workflow runs in the
      # caller's workspace, so a plain checkout never sees a file that lives
      # next to it, and checking this repository out needs a ref that matches
      # the version being called: github.job_workflow_sha, which would give
      # it, is empty in practice, and a branch would make `@v1` and a pinned
      # sha run whatever main holds. Inlined, a pin covers the program too.
      # test/run.sh extracts these very lines, so the tests cover what runs.
      - name: Write the message template
        run: |
          cat > "$RUNNER_TEMP/announce.jq" <<'JQ'
          # Turns release notes into a Bot API sendRichMessage payload.
          #
          # Input (raw, -R -s): either an annotated tag's message, or a whole Keep a
          # Changelog file, depending on --arg mode.
          # Arguments: --arg mode (tag | changelog) --arg chat_id --arg tag
          #            --arg version --arg minor --arg subject --arg repo_url
          #            --arg project_name --arg install_title --arg install_command
          #            --arg install_language --argjson buttons (array of {text, url})
          #            --arg banner_url (empty: no banner) --arg footer (empty: none)
          #
          # The notes travel as plain JSON strings inside explicit blocks, never as
          # Markdown or HTML, so nothing in them can be parsed as formatting or markup
          # and there is nothing to escape. The one exception is `code` spans and
          # [links](https://…), which become typed RichText pieces: still structured
          # data, still no parse mode.

          # {version}, {minor}, {tag} and {repo_url} in a caller-supplied string.
          def subst:
            gsub("\\{version\\}"; $version)
            | gsub("\\{minor\\}"; $minor)
            | gsub("\\{tag\\}"; $tag)
            | gsub("\\{repo_url\\}"; $repo_url);

          # Splits a line of notes into RichText: `code` and [text](url) become typed
          # pieces, the rest stays plain. A line with neither stays a bare string.
          def rich:
            . as $s
            | [match("`([^`]+)`|\\[([^\\]]+)\\]\\((https?://[^)\\s]+)\\)"; "g")] as $m
            | if ($m | length) == 0 then $s
              else
                reduce $m[] as $x ({pos: 0, out: []};
                  .out += (if $x.offset > .pos then [$s[.pos:$x.offset]] else [] end)
                  | .out += [if $x.captures[0].string != null
                             then {type: "code", text: $x.captures[0].string}
                             else {type: "url", text: $x.captures[1].string,
                                   url: $x.captures[2].string} end]
                  | .pos = $x.offset + $x.length)
                | .out + (if .pos < ($s | length) then [$s[.pos:]] else [] end)
              end;

          def para: {type: "paragraph", text: rich};

          # Joins wrapped lines back into one, as the tag message wraps at ~78 columns
          # and a changelog bullet continues on indented lines.
          def unwrap: map(sub("^\\s+"; "")) | join(" ");

          # A section title gets an emoji matching what it holds; anything unrecognised
          # still gets one, so every section reads the same. Covers the tag notes'
          # usual titles and every Keep a Changelog one.
          def section_emoji:
            ascii_downcase as $t
            | if ($t | test("fix|bug")) then "🐛"
              elif ($t | test("feat|new|add")) then "✨"
              elif ($t | test("secur|cve|advisor")) then "🔒"
              elif ($t | test("break|upgrade|migrat|deprecat")) then "⚠️"
              elif ($t | test("chang")) then "🔄"
              elif ($t | test("remov")) then "🗑️"
              elif ($t | test("depend")) then "📦"
              else "📝" end;

          def titled: "\(section_emoji) \(.)";

          # A paragraph that warns about upgrading ("Upgrade note: …") is folded like
          # the lists: its title stays visible with a warning sign, and the explanation,
          # usually the longest text in the notes, opens on a tap.
          def lead_block:
            if test("^(upgrade|breaking|migration) note:"; "i") then
              capture("^(?<title>[^:]+):\\s*(?<rest>.*)$"; "s") as $m
              | {type: "details",
                 summary: {type: "bold", text: "⚠️ \($m.title)"},
                 blocks: [{type: "paragraph",
                           text: (($m.rest[0:1] | ascii_upcase) + $m.rest[1:] | rich)}]}
            else para end;

          # "- " lines (with their wrapped continuations) as one bulleted list block.
          def list_block:
            {type: "list",
             items: (
               reduce .[] as $l ([];
                 if ($l | test("^- ")) then . + [[($l | sub("^- "; ""))]]
                 else .[:-1] + [.[-1] + [$l]] end)
               | map({blocks: [{type: "paragraph", text: (unwrap | rich)}]}))};

          # One blank-line-separated chunk of the notes. A short title line followed by
          # "- " items becomes a collapsed section, so a long list of fixes does not
          # bury the rest of the message; otherwise the lead lines are a paragraph (or a
          # heading, when it is a single short line with no full stop) and any items a
          # plain list.
          def chunk_blocks:
            split("\n") as $lines
            | ([$lines | to_entries[] | select(.value | test("^- ")) | .key] | first) as $first
            | (if $first == null then $lines else $lines[:$first] end) as $lead
            | (if $first == null then [] else $lines[$first:] end) as $rest
            | (($lead | length) == 1 and ($lead[0] | length) <= 40
               and ($lead[0] | test("[.:]$") | not)) as $is_title
            | if $is_title and ($rest | length) > 0 then
                [{type: "details",
                  summary: {type: "bold", text: ($lead[0] | titled)},
                  blocks: [$rest | list_block]}]
              else
                (if ($lead | length) == 0 then []
                 elif $is_title then [{type: "heading", size: 3, text: ($lead[0] | titled)}]
                 else [$lead | unwrap | lead_block]
                 end)
                + (if ($rest | length) == 0 then [] else [$rest | list_block] end)
              end;

          # The section of a Keep a Changelog file for this version: the lines after its
          # "## [X.Y.Z] — date" heading up to the next "## ". Returns {date, body}, with
          # body rewritten into the tag notes' shape (a "### Fixed" line becomes a bare
          # "Fixed" title, its bullets lose the blank lines between them), or null when
          # the version has no section.
          def changelog_section:
            split("\n") as $lines
            | ("^##\\s+\\[?v?" + ($version | gsub("\\."; "\\.")) + "\\]?(\\s|$)") as $heading
            | ([$lines | to_entries[] | select(.value | test($heading)) | .key] | first) as $at
            | if $at == null then null
              else
                ($lines[$at + 1:]
                 | (([to_entries[] | select(.value | test("^## ")) | .key] | first) as $end
                    | if $end == null then . else .[:$end] end)) as $section
                | {date: (($lines[$at] | capture("(?<d>\\d{4}-\\d{2}-\\d{2})").d) // ""),
                   body: (
                     reduce $section[] as $l ({out: [], in_list: false};
                       if ($l | test("^###\\s")) then
                         .out += ["", ($l | sub("^###\\s+"; "") | sub("\\s+$"; ""))] | .in_list = true
                       elif .in_list then
                         if ($l | test("^\\s*$")) then .
                         elif ($l | test("^[-*]\\s")) then .out += [($l | sub("^\\*\\s"; "- "))]
                         else .out += [$l] end
                       else .out += [$l] end)
                     | .out | join("\n"))}
              end;

          # The whole message, with the notes cut at $cap characters.
          def message($cap):
            (if $mode == "changelog" then
               (changelog_section // {date: "", body: ""})
             else
               {date: "", body: .}
             end) as $notes
            | ($notes.body[0:$cap] | sub("\\s+$"; "")) as $body
            | ([$body | splits("\\n\\s*\\n")] | map(sub("^\\s+"; "") | sub("\\s+$"; "")) | map(select(. != ""))) as $chunks
            | (if $mode == "changelog" then
                 (if $notes.date == "" then null else "📅 " end)
               else "✨ " end) as $sub_icon
            | (if $mode == "changelog" then $notes.date else $subject end) as $sub_text
            | {
                chat_id: $chat_id,
                rich_message: {
                  skip_entity_detection: true,
                  blocks: (
                    (if $banner_url == "" then []
                     else [{type: "photo", photo: {type: "photo", media: $banner_url}}] end)
                    + [{type: "heading", size: 1,
                        text: ["🚀 \($project_name) ", {type: "bold", text: $version}]}]
                    + (if $sub_text == "" then []
                       else [
                         # Blocks carry no spacing of their own; a line holding only a
                         # non-breaking space sets the version apart from its subtitle.
                         {type: "paragraph", text: " "},
                         {type: "paragraph", text: [$sub_icon, {type: "italic", text: $sub_text}]}
                       ] end)
                    + ($chunks | map(chunk_blocks) | add // [])
                    + [{type: "divider"}]
                    + (if $install_command == "" then []
                       else [
                         # A code block rather than inline code: Telegram gives it a copy
                         # button, and the whole command is what people paste.
                         {type: "paragraph", text: {type: "bold", text: $install_title}},
                         {type: "pre", language: $install_language, text: ($install_command | subst)}
                       ] end)
                    + (if ($buttons | length) == 0 then []
                       else [{type: "buttons", align: "center",
                              buttons: ($buttons | map({text: .text, url: (.url | subst)}))}] end)
                    + (if $footer == "" then []
                       else [{type: "footer", text: ($footer | subst)}] end)
                  )
                }
              };

          # Rich messages take up to 32768 characters, and the JSON around the text
          # counts against that in the worst case, so a runaway changelog is cut (in
          # halves) until the whole payload fits: the announcement is never lost, and the
          # full notes are one tap away on GitHub.
          def fit($cap):
            message($cap) as $m
            | if ($m | tostring | length) <= 32000 or $cap < 500 then $m
              else fit($cap / 2 | floor) end;

          fit(30000)
          JQ

      # actions/checkout replaces an annotated tag with a lightweight one
      # pointing at the commit (actions/checkout#290), and a manual run does
      # not fetch it at all — either way the release notes would be lost.
      # Fetching the tag object itself keeps its message.
      - name: Fetch the annotated tag
        run: git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"

      - name: Build the message
        id: build
        run: |
          # Chosen here rather than with `cond && a || b` in the env block:
          # that idiom falls through to the real channel whenever the test
          # chat secret is empty.
          if [ "$CHAT" = test ]; then chat_id="$TELEGRAM_TEST_CHAT_ID"; else chat_id="$TELEGRAM_CHAT_ID"; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$chat_id" ]; then
            echo "::notice::No bot token or chat id secret for this target; the message is built but not sent"
          elif [ "$DRY_RUN" != true ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

          version="${TAG#v}"
          subject=""
          if [ "$NOTES_SOURCE" = changelog ]; then
            # Read at the tag, not from the checked-out branch: a manual run
            # may be on a later commit whose changelog has moved on.
            git show "$TAG:$CHANGELOG_PATH" > "$RUNNER_TEMP/notes.txt" \
              || { echo "::error::$CHANGELOG_PATH does not exist at $TAG"; exit 1; }
            if ! grep -Eq "^##[[:space:]]+\[?v?${version//./\\.}\]?([[:space:]]|$)" "$RUNNER_TEMP/notes.txt"; then
              echo "::warning::$CHANGELOG_PATH has no section for $version; announcing it without notes"
            fi
          else
            if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
              echo "::warning::$TAG is a lightweight tag; announcing it without notes"
            fi
            subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" > "$RUNNER_TEMP/notes.txt"
          fi

          # An external banner (a generated social card, say) wins over the
          # repository's. Its placeholders are filled here, in bash, so the
          # same value works as one organization variable for every repository.
          # Otherwise Telegram fetches the repository's banner, linked at the
          # tag rather than at main: a later redesign must not change an old
          # post. Telegram keeps its own copy once sent, so an external image
          # changing later does not touch old posts either.
          banner_url=""
          if [ -n "$BANNER_URL" ]; then
            banner_url="$BANNER_URL"
            banner_url="${banner_url//\{repo\}/${GITHUB_REPOSITORY#*/}}"
            banner_url="${banner_url//\{owner\}/${GITHUB_REPOSITORY%%/*}}"
            banner_url="${banner_url//\{version\}/$version}"
            banner_url="${banner_url//\{minor\}/$(cut -d. -f1,2 <<< "$version")}"
            banner_url="${banner_url//\{tag\}/$TAG}"
          elif git cat-file -e "refs/tags/$TAG:$BANNER_PATH" 2>/dev/null; then
            banner_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/$BANNER_PATH"
          fi

          # Rich messages take up to 32768 characters; the jq program cuts the
          # notes at 30000 so a runaway changelog cannot lose the announcement.
          # The full notes are one tap away on GitHub. The head only stops jq
          # from slurping something absurd.
          head -c 2000000 "$RUNNER_TEMP/notes.txt" \
            | jq -R -s -f "$RUNNER_TEMP/announce.jq" \
                --arg mode "$NOTES_SOURCE" \
                --arg chat_id "$chat_id" \
                --arg tag "$TAG" \
                --arg version "$version" \
                --arg minor "$(cut -d. -f1,2 <<< "$version")" \
                --arg subject "${subject:-$TAG}" \
                --arg repo_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --arg project_name "$PROJECT_NAME" \
                --arg install_title "$INSTALL_TITLE" \
                --arg install_command "$INSTALL_COMMAND" \
                --arg install_language "$INSTALL_LANGUAGE" \
                --argjson buttons "$BUTTONS" \
                --arg banner_url "$banner_url" \
                --arg footer "$FOOTER" \
            > "$RUNNER_TEMP/message.json"
          # chat_id is a secret, so it shows as *** here.
          jq . "$RUNNER_TEMP/message.json"

      # The release is already public by the time this runs, so a Telegram
      # outage or a revoked bot must not turn a good release red. A failure
      # still shows as a warning on the run.
      - name: Send to Telegram
        if: steps.build.outputs.send == 'true'
        continue-on-error: true
        run: |
          # The token lives in the URL, so the URL goes to curl on stdin rather
          # than on its command line: it never appears in `ps`, in a `set -x`
          # trace or in a curl error message. Secrets are masked in the log
          # anyway; this keeps it out of everything else.
          printf 'url = "https://api.telegram.org/bot%s/sendRichMessage"\n' "$TELEGRAM_BOT_TOKEN" \
            | curl --config - --silent --show-error \
                --max-time 30 --retry 3 --retry-delay 5 \
                --header 'Content-Type: application/json' \
                --data-binary "@$RUNNER_TEMP/message.json" \
                --output "$RUNNER_TEMP/response.json" \
            || true
          if [ "$(jq -r '.ok' "$RUNNER_TEMP/response.json" 2>/dev/null)" != true ]; then
            reason="$(jq -r '"\(.error_code) \(.description)"' "$RUNNER_TEMP/response.json" 2>/dev/null || echo 'no response')"
            echo "::warning::Telegram announcement not sent: $reason"
            exit 1
          fi
          echo "Sent as message $(jq -r '.result.message_id' "$RUNNER_TEMP/response.json")"
