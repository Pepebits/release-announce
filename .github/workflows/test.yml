name: Test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run's answer irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jq:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # Builds the message from the fixtures with the same jq program the
      # workflow runs, and asserts on the JSON it produces.
      - name: Build and check the messages
        run: test/run.sh

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # Pinned, so a new lint rule cannot turn an unrelated change red. The
      # image bundles shellcheck, which also reads the `run:` scripts.
      - name: Lint the workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
